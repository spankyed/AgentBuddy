<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent X</title>
    <style>
      /* Fallback error page — self-contained, no Tailwind/Vue dependency */
      #error-page {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #171717;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 2rem;
        text-align: center;
      }
      #error-page .content { max-width: 480px; width: 100%; }
      #error-page .icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.6; }
      #error-page h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 0.5rem; }
      #error-page .subtitle { color: #a3a3a3; font-size: 0.875rem; margin: 0 0 1.5rem; line-height: 1.5; }
      #error-page details { text-align: left; margin-bottom: 1.5rem; background: #262626; border-radius: 8px; padding: 0; }
      #error-page summary { cursor: pointer; padding: 0.75rem 1rem; font-size: 0.8rem; color: #a3a3a3; user-select: none; }
      #error-page pre {
        margin: 0; padding: 0 1rem 0.75rem; font-size: 0.75rem; color: #ef4444;
        white-space: pre-wrap; word-break: break-word; max-height: 200px; overflow-y: auto;
        font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
      }
      #error-page .reload-btn {
        background: #2563eb; color: #fff; border: none; border-radius: 6px;
        padding: 0.5rem 1.5rem; font-size: 0.875rem; font-weight: 500; cursor: pointer;
      }
      #error-page .reload-btn:hover { background: #3b82f6; }
    </style>
  </head>
  <body>
    <div id="error-page">
      <div class="content">
        <div class="icon">&#9888;</div>
        <h1 id="error-title">Something went wrong</h1>
        <p class="subtitle">The application encountered an unexpected error.</p>
        <details>
          <summary>Error details</summary>
          <pre id="error-detail"></pre>
        </details>
        <button class="reload-btn" onclick="window.location.reload()">Reload</button>
      </div>
    </div>

    <script>
      window.__showErrorPage = function(title, detail) {
        if (window.__errorPageShown) return;
        window.__errorPageShown = true;
        var errorPage = document.getElementById('error-page');
        var appEl = document.getElementById('app');
        if (!errorPage) return;
        document.getElementById('error-title').textContent = title || 'Something went wrong';
        document.getElementById('error-detail').textContent = detail || '';
        errorPage.style.display = 'flex';
        if (appEl) appEl.style.display = 'none';
      };

      window.addEventListener('unhandledrejection', function(e) {
        var err = e.reason;
        window.__showErrorPage('Something went wrong',
          (err instanceof Error) ? (err.stack || err.message) : String(err));
      });
    </script>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
