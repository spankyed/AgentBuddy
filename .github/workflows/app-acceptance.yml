name: App acceptance

on:
  workflow_dispatch:
    inputs:
      test:
        description: Optional app test name pattern; empty runs complete app acceptance
        type: string
        default: ''
  workflow_call:
    inputs:
      test:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: app-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: macos-26
    # Includes the cold builds, fork producer, app suites and bounded source-dev scenario.
    timeout-minutes: 45
    env:
      APACK_CHAIN_CORES: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23.11.1
          cache: npm
      - name: Record source
        run: git rev-parse HEAD
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Build shipped pack
        run: npm run build:default-setup
      - name: Build app runtime
        id: runtime
        # The first cold macos-26 run exhausted V8's default ~2 GiB renderer-build heap.
        # Scope the larger heap to building the app, rather than changing test/compiler process limits.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build:runtime -- --cores 2
      - name: Build fixture contracts
        id: preparation
        if: ${{ inputs.test == '' }}
        run: npm run test:external-pack:contract
      - name: Prepare external default fork
        if: ${{ inputs.test == '' }}
        run: npm run test:external-pack:fork
      - name: External pack app suite including step services and settings ownership
        if: ${{ inputs.test == '' }}
        working-directory: tests/packs/external-pack
        run: ../../../node_modules/.bin/apack pack test --host "$GITHUB_WORKSPACE" --prebuilt
      - name: App suites including settings recovery
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        env:
          APACK_E2E_GREP: ${{ inputs.test }}
        run: |
          if [[ -n "$APACK_E2E_GREP" ]]; then
            npm run test:e2e -- --grep "$APACK_E2E_GREP"
          else
            npm run test:e2e
          fi
      - name: Retain app suites before the CLI scenario
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-acceptance-${{ github.sha }}-suites
          include-hidden-files: true
          path: |
            .apack/tests/results/
            tests/packs/*/.apack/tests/results/
            tests/packs/*/dist/build-inputs.json
      - name: Source pack dev install and rebuild
        if: ${{ !cancelled() && inputs.test == '' && steps.preparation.outcome == 'success' }}
        run: node scripts/with-source.mjs tsx tests/scripts/test-pack-dev.ts
      - name: Real LMDB import and rollback
        if: ${{ !cancelled() && inputs.test == '' && steps.preparation.outcome == 'success' }}
        working-directory: packages/apack-host
        run: node ../../scripts/with-source.mjs node ../../node_modules/vitest/vitest.mjs run tests/backup/import.spec.ts --maxWorkers 2
      - name: Retain app evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-acceptance-${{ github.sha }}
          include-hidden-files: true
          path: |
            .apack/tests/results/
            tests/packs/*/.apack/tests/results/
            tests/packs/*/dist/build-inputs.json
