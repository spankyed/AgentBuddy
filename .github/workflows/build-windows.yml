name: Build Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 0.1.0). Leave empty to use package.json version.'
        required: false
        type: string

concurrency:
  group: release-win-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - name: Validate version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Build and package
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build-prod

      - name: Upload artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Wait briefly for the macOS workflow to create the release
          sleep 30
          assets=(dist/AgentBuddy-*.exe)

          # Upload to existing release, or create if mac workflow hasn't yet
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --generate-notes \
              --title "AgentBuddy $GITHUB_REF_NAME" \
              "${assets[@]}" || {
                status=$?
                if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                  gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
                else
                  exit "$status"
                fi
              }
          fi
