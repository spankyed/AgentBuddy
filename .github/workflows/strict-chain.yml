name: Generation context diagnostic

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: generation-context-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      APACK_CHAIN_CORES: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23.11.1
          cache: npm
      - name: Record source and platform
        run: |
          git rev-parse HEAD
          sw_vers
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,versions:process.versions})'
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Build matching compiler packages
        run: npm run packages:ensure
      - name: Measure generation and verify its report handoff
        run: |
          node --import tsx --conditions=@apackdev/source --input-type=module <<'JS' | tee "$RUNNER_TEMP/generation.log"
          import assert from 'node:assert/strict';
          import { GENERATE_ENTRIES, RECORDED_FILE_CHECKS } from './scripts/lib/typecheck-jobs.ts';
          import { boundedSpawn } from './scripts/lib/bounded-spawn.ts';
          const report = RECORDED_FILE_CHECKS.find(job => job.name === 'facade:check');
          assert.ok(report);
          for (const [job, deadline] of [[GENERATE_ENTRIES,180_000],[report,60_000]]) {
            const [command,...args] = job.command.split(' ');
            console.log('Generation diagnostic phase starts:',job.name);
            const result = await boundedSpawn(command,args,deadline,{cwd:job.cwd,stream:true});
            console.log(JSON.stringify({phase:job.name,code:result.code,ms:result.ms,timedOut:result.timedOut}));
            assert.equal(result.code,0,job.name);
          }
          JS
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generation-context-${{ github.sha }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/generation.log
