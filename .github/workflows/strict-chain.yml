name: Complete native and worker scenario acceptance
on:
  workflow_dispatch: null
  workflow_call: null
permissions:
  contents: read
concurrency:
  group: worker-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 65
    env:
      APACK_CHAIN_CORES: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23.11.1
          cache: npm
      - name: Record source and runner
        run: |
          git rev-parse HEAD
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,cores:require("node:os").availableParallelism(),versions:process.versions})'
      - name: Install dependencies
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Prepare published packages
        timeout-minutes: 10
        run: npm run packages:ensure
      - name: Typecheck repaired CLI
        id: types
        timeout-minutes: 5
        run: npx tsc -p packages/apack-cli --noEmit
      - name: Accept complete worker file beside native compiler concurrency
        if: ${{ !cancelled() && steps.types.outcome == 'success' }}
        run: |
          node --import tsx --input-type=module <<'JS' 2>&1 | tee "$RUNNER_TEMP/worker-build.log"
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { boundedSpawn } from './scripts/lib/bounded-spawn.ts';
          const prefix=process.env.RUNNER_TEMP+'/worker-build';
          const args=["node_modules/vitest/vitest.mjs","run","--config","vitest.integration.config.ts","packages/apack-cli/tests/build/build-worker.integration.spec.ts","packages/apack-cli/tests/build/compiler-native-libraries.integration.spec.ts","--bail=0","--poolOptions.threads.maxThreads=2","--poolOptions.threads.minThreads=1","--poolOptions.forks.maxForks=2","--poolOptions.forks.minForks=1","--reporter=verbose","--reporter=json"];
          args.push('--outputFile='+prefix+'.json');
          const result=await boundedSpawn('node',args,1800000,{stream:true});
          const report=fs.existsSync(prefix+'.json')?JSON.parse(fs.readFileSync(prefix+'.json','utf8')):undefined;
          const status={code:result.code,ms:result.ms,timedOut:result.timedOut,passed:report?.numPassedTests,failed:report?.numFailedTests,pending:report?.numPendingTests,errors:report?.numRuntimeErrorTestSuites};
          fs.writeFileSync(prefix+'-status.json',JSON.stringify(status,null,2));
          console.log(JSON.stringify(status));
          assert.equal((status.passed??0)+(status.failed??0),41,'Every case in both files must execute');
          process.exitCode=result.code;
          JS
      - name: Preserve worker concurrency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-build-${{ github.sha }}
          path: ${{ runner.temp }}/worker-build*
