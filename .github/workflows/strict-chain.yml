name: Two-case watch timeline diagnostic

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: watch-timeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      APACK_CHAIN_CORES: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23.11.1
          cache: npm
      - name: Record diagnostic source and runner
        run: |
          git rev-parse HEAD
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,cores:require("node:os").availableParallelism(),versions:process.versions})'
      - name: Install dependencies
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Prepare published packages
        timeout-minutes: 10
        run: npm run packages:ensure
      - name: Typecheck diagnostic source
        timeout-minutes: 5
        run: npx tsc -p packages/apack-cli --noEmit
      - name: Trace two real watcher rebuilds
        run: |
          node --import tsx --input-type=module <<'JS' 2>&1 | tee "$RUNNER_TEMP/watch-proof.log"
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { boundedSpawn } from './scripts/lib/bounded-spawn.ts';
          const prefix=process.env.RUNNER_TEMP+'/watch-proof';
          const args=['node_modules/vitest/vitest.mjs','run','--config','vitest.integration.config.ts',
            'packages/apack-cli/tests/build/watch-module-freshness.integration.spec.ts',
            'packages/apack-cli/tests/build/frontend-resources.integration.spec.ts',
            '--testNamePattern','refreshes flow modules loaded through ordinary imports|watches an external css-url asset',
            '--bail=0','--poolOptions.threads.maxThreads=2','--poolOptions.threads.minThreads=1',
            '--poolOptions.forks.maxForks=2','--poolOptions.forks.minForks=1',
            '--reporter=verbose','--reporter=json','--outputFile='+prefix+'.json'];
          const result=await boundedSpawn('node',args,420000,{stream:true});
          const report=fs.existsSync(prefix+'.json')?JSON.parse(fs.readFileSync(prefix+'.json','utf8')):undefined;
          const status={code:result.code,ms:result.ms,timedOut:result.timedOut,passed:report?.numPassedTests,failed:report?.numFailedTests,pending:report?.numPendingTests};
          fs.writeFileSync(prefix+'-status.json',JSON.stringify(status,null,2));
          console.log(JSON.stringify(status));
          assert.equal((status.passed??0)+(status.failed??0),2,'Exactly two real watch cases must execute');
          process.exitCode=result.code;
          JS
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-timeline-${{ github.sha }}
          path: ${{ runner.temp }}/watch-proof*
