name: Affected integration repair acceptance

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: affected-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 150
    env:
      APACK_CHAIN_CORES: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23.11.1
          cache: npm
      - name: Record source and platform
        run: |
          git rev-parse HEAD
          sw_vers
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch})'
      - name: Install dependencies
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Prepare typecheck records
        timeout-minutes: 20
        run: npm run typecheck -- --cores 2
      - name: Build required pack output
        timeout-minutes: 10
        run: npm run build:default-setup
      - name: Prepare declared external fixture outputs
        id: fixtures
        timeout-minutes: 15
        run: npm run test:external-pack:contract
      - name: Affected batch 1 (8 files)
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        continue-on-error: true
        run: |
          node --import tsx --input-type=module <<'JS' 2>&1 | tee "$RUNNER_TEMP/affected-1.log"
          import fs from 'node:fs';
          import { boundedSpawn } from './scripts/lib/bounded-spawn.ts';
          const prefix = process.env.RUNNER_TEMP + '/affected-1';
          const args = ["node_modules/vitest/vitest.mjs","run","--config","vitest.integration.config.ts","packages/apack-cli/tests/build/build-output-swap.integration.spec.ts","packages/apack-cli/tests/commands/facade-report.integration.spec.ts","packages/apack-cli/tests/build/staged-dsl.integration.spec.ts","packages/apack-cli/tests/build/watch-publication.integration.spec.ts","packages/apack-cli/tests/build/facade-type-data.integration.spec.ts","packages/apack-cli/tests/build/types-bundler-determinism.integration.spec.ts","packages/apack-cli/tests/build/compilation-inputs.integration.spec.ts","packages/apack-cli/tests/build/build-registry.integration.spec.ts","--bail=0","--poolOptions.threads.maxThreads=2","--poolOptions.threads.minThreads=1","--poolOptions.forks.maxForks=2","--poolOptions.forks.minForks=1","--reporter=verbose","--reporter=json"];
          args.push('--outputFile=' + prefix + '.json');
          const result = await boundedSpawn('node', args, 1800000, {stream:true});
          const status = {files:["packages/apack-cli/tests/build/build-output-swap.integration.spec.ts","packages/apack-cli/tests/commands/facade-report.integration.spec.ts","packages/apack-cli/tests/build/staged-dsl.integration.spec.ts","packages/apack-cli/tests/build/watch-publication.integration.spec.ts","packages/apack-cli/tests/build/facade-type-data.integration.spec.ts","packages/apack-cli/tests/build/types-bundler-determinism.integration.spec.ts","packages/apack-cli/tests/build/compilation-inputs.integration.spec.ts","packages/apack-cli/tests/build/build-registry.integration.spec.ts"],code:result.code,ms:result.ms,timedOut:result.timedOut};
          fs.writeFileSync(prefix+'-status.json',JSON.stringify(status,null,2));
          console.log(JSON.stringify(status));
          process.exitCode = result.code;
          JS
      - name: Affected batch 2 (8 files)
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        continue-on-error: true
        run: |
          node --import tsx --input-type=module <<'JS' 2>&1 | tee "$RUNNER_TEMP/affected-2.log"
          import fs from 'node:fs';
          import { boundedSpawn } from './scripts/lib/bounded-spawn.ts';
          const prefix = process.env.RUNNER_TEMP + '/affected-2';
          const args = ["node_modules/vitest/vitest.mjs","run","--config","vitest.integration.config.ts","packages/apack-cli/tests/commands/scaffold.integration.spec.ts","packages/apack-cli/tests/build/package-inputs.integration.spec.ts","packages/apack-cli/tests/build/watch-worker-inputs.integration.spec.ts","packages/apack-cli/tests/build/dependency-graph.integration.spec.ts","packages/apack-cli/tests/build/facade-typing.integration.spec.ts","packages/apack-cli/tests/build/frontend-workers.integration.spec.ts","packages/apack-cli/tests/commands/info.integration.spec.ts","packages/apack-cli/tests/build/editor-declarations.integration.spec.ts","--bail=0","--poolOptions.threads.maxThreads=2","--poolOptions.threads.minThreads=1","--poolOptions.forks.maxForks=2","--poolOptions.forks.minForks=1","--reporter=verbose","--reporter=json"];
          args.push('--outputFile=' + prefix + '.json');
          const result = await boundedSpawn('node', args, 1800000, {stream:true});
          const status = {files:["packages/apack-cli/tests/commands/scaffold.integration.spec.ts","packages/apack-cli/tests/build/package-inputs.integration.spec.ts","packages/apack-cli/tests/build/watch-worker-inputs.integration.spec.ts","packages/apack-cli/tests/build/dependency-graph.integration.spec.ts","packages/apack-cli/tests/build/facade-typing.integration.spec.ts","packages/apack-cli/tests/build/frontend-workers.integration.spec.ts","packages/apack-cli/tests/commands/info.integration.spec.ts","packages/apack-cli/tests/build/editor-declarations.integration.spec.ts"],code:result.code,ms:result.ms,timedOut:result.timedOut};
          fs.writeFileSync(prefix+'-status.json',JSON.stringify(status,null,2));
          console.log(JSON.stringify(status));
          process.exitCode = result.code;
          JS
      - name: Affected batch 3 (8 files)
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        continue-on-error: true
        run: |
          node --import tsx --input-type=module <<'JS' 2>&1 | tee "$RUNNER_TEMP/affected-3.log"
          import fs from 'node:fs';
          import { boundedSpawn } from './scripts/lib/bounded-spawn.ts';
          const prefix = process.env.RUNNER_TEMP + '/affected-3';
          const args = ["node_modules/vitest/vitest.mjs","run","--config","vitest.integration.config.ts","packages/apack-cli/tests/commands/add-extensions.integration.spec.ts","packages/apack-cli/tests/build/frontend-resources.integration.spec.ts","packages/apack-cli/tests/build/frontend-generation.integration.spec.ts","packages/apack-cli/tests/build/watch-module-freshness.integration.spec.ts","packages/apack-cli/tests/build/facade-typing-published.integration.spec.ts","packages/apack-cli/tests/build/watch-external-types.integration.spec.ts","packages/apack-cli/tests/build/dependency-inputs.integration.spec.ts","packages/repo-checks/tests/dev-pack-hmr.integration.spec.ts","--bail=0","--poolOptions.threads.maxThreads=2","--poolOptions.threads.minThreads=1","--poolOptions.forks.maxForks=2","--poolOptions.forks.minForks=1","--reporter=verbose","--reporter=json"];
          args.push('--outputFile=' + prefix + '.json');
          const result = await boundedSpawn('node', args, 1800000, {stream:true});
          const status = {files:["packages/apack-cli/tests/commands/add-extensions.integration.spec.ts","packages/apack-cli/tests/build/frontend-resources.integration.spec.ts","packages/apack-cli/tests/build/frontend-generation.integration.spec.ts","packages/apack-cli/tests/build/watch-module-freshness.integration.spec.ts","packages/apack-cli/tests/build/facade-typing-published.integration.spec.ts","packages/apack-cli/tests/build/watch-external-types.integration.spec.ts","packages/apack-cli/tests/build/dependency-inputs.integration.spec.ts","packages/repo-checks/tests/dev-pack-hmr.integration.spec.ts"],code:result.code,ms:result.ms,timedOut:result.timedOut};
          fs.writeFileSync(prefix+'-status.json',JSON.stringify(status,null,2));
          console.log(JSON.stringify(status));
          process.exitCode = result.code;
          JS
      - name: Changed native command and selection cases
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        continue-on-error: true
        run: |
          node --import tsx --input-type=module <<'JS' 2>&1 | tee "$RUNNER_TEMP/native-changed.log"
          import fs from 'node:fs';
          import { boundedSpawn } from './scripts/lib/bounded-spawn.ts';
          const prefix = process.env.RUNNER_TEMP + '/native-changed';
          const args = ["node_modules/vitest/vitest.mjs","run","--config","vitest.integration.config.ts","packages/apack-cli/tests/build/compiler-native-libraries.integration.spec.ts","--testNamePattern","builds and archives a real pack|retains launch-time native search paths|refuses external .* before native initialization after preload mutation|captures the selected native image suffix","--bail=0","--poolOptions.threads.maxThreads=2","--poolOptions.threads.minThreads=1","--poolOptions.forks.maxForks=2","--poolOptions.forks.minForks=1","--reporter=verbose","--reporter=json"];
          args.push('--outputFile=' + prefix + '.json');
          const result = await boundedSpawn('node', args, 900000, {stream:true});
          const status = {files:["packages/apack-cli/tests/build/compiler-native-libraries.integration.spec.ts"],code:result.code,ms:result.ms,timedOut:result.timedOut};
          fs.writeFileSync(prefix+'-status.json',JSON.stringify(status,null,2));
          console.log(JSON.stringify(status));
          process.exitCode = result.code;
          JS
      - name: Changed worker mutation and cancellation cases
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        continue-on-error: true
        run: |
          node --import tsx --input-type=module <<'JS' 2>&1 | tee "$RUNNER_TEMP/worker-changed.log"
          import fs from 'node:fs';
          import { boundedSpawn } from './scripts/lib/bounded-spawn.ts';
          const prefix = process.env.RUNNER_TEMP + '/worker-changed';
          const args = ["node_modules/vitest/vitest.mjs","run","--config","vitest.integration.config.ts","packages/apack-cli/tests/build/build-worker.integration.spec.ts","--testNamePattern","refuses candidate output changed by a compiler exit handler|removes its worker and compiler when the public build command is stopped","--bail=0","--poolOptions.threads.maxThreads=2","--poolOptions.threads.minThreads=1","--poolOptions.forks.maxForks=2","--poolOptions.forks.minForks=1","--reporter=verbose","--reporter=json"];
          args.push('--outputFile=' + prefix + '.json');
          const result = await boundedSpawn('node', args, 900000, {stream:true});
          const status = {files:["packages/apack-cli/tests/build/build-worker.integration.spec.ts"],code:result.code,ms:result.ms,timedOut:result.timedOut};
          fs.writeFileSync(prefix+'-status.json',JSON.stringify(status,null,2));
          console.log(JSON.stringify(status));
          process.exitCode = result.code;
          JS
      - name: Collect affected-case evidence
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const labels=["affected-1","affected-2","affected-3","native-changed","worker-changed"];
          const results=labels.map(label=>{const prefix=process.env.RUNNER_TEMP+'/'+label;const status=fs.existsSync(prefix+'-status.json')?JSON.parse(fs.readFileSync(prefix+'-status.json','utf8')):{missing:true};const report=fs.existsSync(prefix+'.json')?JSON.parse(fs.readFileSync(prefix+'.json','utf8')):undefined;return {label,status,files:report?.testResults?.length,passed:report?.numPassedTests,failed:report?.numFailedTests,pending:report?.numPendingTests};});
          fs.writeFileSync(process.env.RUNNER_TEMP+'/affected-summary.json',JSON.stringify(results,null,2));
          console.log(JSON.stringify(results,null,2));
          assert.equal(results.slice(0,3).reduce((n,r)=>n+(r.files??0),0),24,'Every affected file needs a completed report');
          assert.ok((results[3].passed??0)+(results[3].failed??0)>=6,'Changed native selections must execute');
          assert.ok((results[4].passed??0)+(results[4].failed??0)>=5,'Changed worker cases must execute');
          assert.ok(results.every(r=>r.status.code===0),'Inspect retained affected-case failures');
          JS
      - name: Preserve all affected-case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affected-integration-${{ github.sha }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/affected-*.log
            ${{ runner.temp }}/affected-*.json
            ${{ runner.temp }}/native-changed*
            ${{ runner.temp }}/worker-changed*
