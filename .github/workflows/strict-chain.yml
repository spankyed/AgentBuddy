name: Standalone typecheck diagnostic

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: typecheck-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      APACK_CHAIN_CORES: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23.11.1
          cache: npm
      - name: Record source and platform
        run: |
          git rev-parse HEAD
          sw_vers
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,versions:process.versions})'
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Verify standalone source coordinator
        run: npm run typecheck -- --cores 2 | tee "$RUNNER_TEMP/typecheck.log"
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-source-${{ github.sha }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/typecheck.log
