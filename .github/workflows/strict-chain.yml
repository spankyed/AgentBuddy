name: Watch and reporting repair acceptance

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: watch-reporting-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: macos-26
    # Eight affected files with unchanged case bounds; preparation builds their actual dependencies.
    timeout-minutes: 90
    env:
      APACK_CHAIN_CORES: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23.11.1
          cache: npm
      - name: Record source and platform
        run: |
          git rev-parse HEAD
          sw_vers
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,versions:process.versions})'
      - name: Install dependencies
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Build published package dependencies
        timeout-minutes: 10
        run: npm run packages:ensure
      - name: Build required pack output
        timeout-minutes: 10
        run: npm run build:default-setup
      - name: Watch and reporting repair acceptance
        timeout-minutes: 55
        run: |
          export LOOP_SAMPLES="$RUNNER_TEMP/event-loops.jsonl"
          export NODE_OPTIONS="${NODE_OPTIONS:-} --import=$GITHUB_WORKSPACE/scripts/lib/loop-sample.mjs"
          node --conditions=@apackdev/source node_modules/vitest/vitest.mjs run \
            --config vitest.integration.config.ts --project @apackdev/cli \
            packages/apack-cli/tests/build/watch-module-freshness.integration.spec.ts \
            packages/apack-cli/tests/build/build-output-swap.integration.spec.ts \
            packages/apack-cli/tests/commands/add-feature-validate.integration.spec.ts \
            packages/apack-cli/tests/build/frontend-resources.integration.spec.ts \
            packages/apack-cli/tests/build/frontend-workers.integration.spec.ts \
            packages/apack-cli/tests/build/package-inputs.integration.spec.ts \
            packages/apack-cli/tests/build/watch-external-types.integration.spec.ts \
            packages/apack-cli/tests/build/watch-publication.integration.spec.ts \
            --maxWorkers 2 --minWorkers 2 --bail 0 \
            --reporter verbose --reporter json --outputFile.json="$RUNNER_TEMP/focused-results.json" \
            2>&1 | tee "$RUNNER_TEMP/focused-diagnostic.log"
      - name: Collect pool reports
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          for (const name of fs.readdirSync(os.tmpdir()).filter(name => name.startsWith('spec-durations-'))) {
            fs.cpSync(path.join(os.tmpdir(), name), path.join(process.env.RUNNER_TEMP, 'pool-reports', name), {recursive:true});
          }
          JS
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-reporting-acceptance-${{ github.sha }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/focused-diagnostic.log
            ${{ runner.temp }}/focused-results.json
            ${{ runner.temp }}/event-loops.jsonl
            node_modules/.cache/apack-chain/runs/
            node_modules/.cache/apack-unit-pool/
            node_modules/.cache/apack-spec-durations/
            ${{ runner.temp }}/pool-reports/
