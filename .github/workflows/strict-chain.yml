name: Integration acceptance probe

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: integration-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: macos-26
    # Cold pack preparation measured 9m55s; typecheck and the existing 10m pool need separate room.
    timeout-minutes: 30
    env:
      APACK_CHAIN_CORES: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23.11.1
          cache: npm
      - name: Record source and platform
        run: |
          git rev-parse HEAD
          sw_vers
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,versions:process.versions})'
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Produce typecheck dependency-read evidence
        run: npm run typecheck -- --cores 2
      - name: Build required pack output
        run: npm run build:default-setup
      - name: Complete integration pool with two cores
        run: npm run test:integration | tee "$RUNNER_TEMP/integration.log"
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-probe-${{ github.sha }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/integration.log
