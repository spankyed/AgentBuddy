name: Strict chain

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: strict-chain-${{ github.ref }}
  cancel-in-progress: false

# The strict chain as parallel jobs. `npm run chain -- --job <name>` derives each job's steps from the chain
# graph (`scripts/lib/chain-only.ts`): `producers` runs what the expensive pools read, then the integration
# shards, the native pool and the remaining steps run beside each other on its outputs. Each consumer
# refuses unless the producers' outputs and stamps it downloaded are current, so no job can pass over
# missing preparation.
jobs:
  producers:
    runs-on: macos-26
    # The cold shipped-pack build, fixture contracts and the typecheck legs
    timeout-minutes: 45
    env:
      APACK_CHAIN_CORES: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23.11.1
          cache: npm
      - name: Record source and platform
        run: |
          git rev-parse HEAD
          sw_vers
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,versions:process.versions})'
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Producers
        run: npm run chain -- --strict --all --cores 2 --no-classify --job producers | tee "$RUNNER_TEMP/strict-chain.log"
      # A tarball keeps file modes and symlinks, which the stamps and the CLI bundle depend on
      - name: Package producer outputs
        run: |
          node scripts/with-source.mjs npx tsx scripts/strict-job-artifact.ts > "$RUNNER_TEMP/producers.list"
          tar -czf "$RUNNER_TEMP/producers.tgz" -T "$RUNNER_TEMP/producers.list"
      - name: Hand producer outputs on
        uses: actions/upload-artifact@v4
        with:
          name: strict-producers-${{ github.sha }}
          path: ${{ runner.temp }}/producers.tgz
          retention-days: 1
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-chain-${{ github.sha }}-producers
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/strict-chain.log
            node_modules/.cache/apack-chain/runs/

  consumers:
    needs: producers
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - { job: integration, shard: '1/3', name: integration-1 }
          - { job: integration, shard: '2/3', name: integration-2 }
          - { job: integration, shard: '3/3', name: integration-3 }
          - { job: native, shard: '', name: native }
          - { job: rest, shard: '', name: rest }
    name: ${{ matrix.name }}
    # The rest job holds the app half (runtime build, smoke, external app, fork, packaged authoring)
    timeout-minutes: ${{ matrix.job == 'rest' && 90 || 60 }}
    env:
      APACK_CHAIN_CORES: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23.11.1
          cache: npm
      - name: Record source
        run: git rev-parse HEAD
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Receive producer outputs
        uses: actions/download-artifact@v4
        with:
          name: strict-producers-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Unpack producer outputs
        run: tar -xzf "$RUNNER_TEMP/producers.tgz"
      - name: ${{ matrix.name }}
        env:
          APACK_STRICT_JOB: ${{ matrix.job }}
          APACK_STRICT_SHARD: ${{ matrix.shard }}
        run: |
          args=(--strict --all --cores 2 --no-classify --job "$APACK_STRICT_JOB")
          if [[ -n "$APACK_STRICT_SHARD" ]]; then args+=(--shard "$APACK_STRICT_SHARD"); fi
          npm run chain -- "${args[@]}" | tee "$RUNNER_TEMP/strict-chain.log"
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-chain-${{ github.sha }}-${{ matrix.name }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/strict-chain.log
            node_modules/.cache/apack-chain/runs/
