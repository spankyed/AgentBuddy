name: Worker lifecycle diagnostic

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: worker-closeout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      APACK_CHAIN_CORES: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23.11.1
          cache: npm
      - name: Record source and platform
        run: |
          git rev-parse HEAD
          sw_vers
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,versions:process.versions})'
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Prepare matching compiler packages
        run: npm run packages:ensure
      - name: Observe complete worker lifecycle file
        run: |
          node node_modules/vitest/vitest.mjs run --config vitest.integration.config.ts --project @apackdev/cli \
            packages/apack-cli/tests/build/build-worker.integration.spec.ts \
            --poolOptions.threads.maxThreads=2 --poolOptions.threads.minThreads=1 --bail=1 \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/worker-closeout.json" | tee "$RUNNER_TEMP/worker-closeout.log"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/worker-closeout.json`, 'utf8'));
          assert.equal(result.numPassedTests, 16);
          assert.equal(result.numFailedTests, 0);
          console.log({passed:result.numPassedTests});
          JS
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-closeout-${{ github.sha }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/worker-closeout.log
            ${{ runner.temp }}/worker-closeout.json
