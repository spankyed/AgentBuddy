name: Build macOS (Signed + Notarized)

on:
  push:
    tags: ['v*']
    branches: []
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 0.1.0). Leave empty to use package.json version.'
        required: false
        type: string

jobs:
  build-mac:
    runs-on: macos-14 # Apple Silicon runner
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - name: Validate version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Compile DSL
        run: npm run compile

      - name: Build packages
        run: SKIP_DSL_GEN=1 npm run build

      - name: Build native helpers
        run: npm run build:speech-macos

      - name: Package, sign, and notarize
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: npx electron-builder build --config electron-builder.mjs --mac --arm64

      - name: Verify signing
        continue-on-error: true
        run: |
          codesign --verify --deep --strict dist/mac-arm64/AgentBuddy.app
          xcrun stapler validate dist/mac-arm64/AgentBuddy.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AgentBuddy-mac-arm64
          path: |
            dist/AgentBuddy-*.dmg
            dist/AgentBuddy-*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --title "AgentBuddy $GITHUB_REF_NAME" \
            dist/AgentBuddy-*.dmg \
            dist/AgentBuddy-*.zip
