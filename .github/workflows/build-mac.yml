name: Build macOS (Signed + Notarized)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 0.1.0). Leave empty to use package.json version.'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-14 # Apple Silicon runner
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - name: Validate version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Write notarization API key to file
        if: env.APPLE_API_KEY != ''
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          echo "$APPLE_API_KEY" > /tmp/AuthKey.p8
          chmod 600 /tmp/AuthKey.p8

      - name: Build, package, sign
        env:
          # @vscode/ripgrep downloads from GitHub API during postinstall;
          # without auth the shared CI runner IP hits the 60 req/hr rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Only export signing env vars if secrets are configured
          # (empty strings cause electron-builder to fail)
          if [ -n "${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}" ]; then
            export CSC_LINK="${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}"
            export CSC_KEY_PASSWORD="${{ secrets.MAC_CERTIFICATE_PASSWORD }}"
          fi
          if [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            export APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
            export APPLE_API_KEY_ID="${{ secrets.APPLE_API_KEY_ID }}"
            export APPLE_API_ISSUER="${{ secrets.APPLE_API_ISSUER }}"
            export APPLE_API_KEY="/tmp/AuthKey.p8"
          fi
          npm run build-prod

      - name: Verify signing
        continue-on-error: true
        run: |
          codesign --verify --deep --strict dist/mac-arm64/AgentBuddy.app
          xcrun stapler validate dist/mac-arm64/AgentBuddy.app

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/AgentBuddy-*.dmg dist/AgentBuddy-*.zip)

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --generate-notes \
              --title "AgentBuddy $GITHUB_REF_NAME" \
              "${assets[@]}" || {
                status=$?
                if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                  gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
                else
                  exit "$status"
                fi
              }
          fi
