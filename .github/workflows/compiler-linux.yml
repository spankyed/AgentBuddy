name: Compiler Linux

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: compiler-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APACK_CHAIN_CORES: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23.11.1
          cache: npm
      - name: Record platform and compiler
        run: |
          git rev-parse HEAD
          uname -a
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,versions:process.versions})'
          test -f "$(dirname "$(command -v node)")/../include/node/node_api.h"
          cc --version
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Build matching packages
        run: npm run packages:ensure
      - name: Native ownership and outside-library admission
        run: >-
          node node_modules/vitest/vitest.mjs run --config vitest.integration.config.ts --project @apackdev/cli
          packages/apack-cli/tests/build/compiler-elf-libraries.integration.spec.ts
          --bail=1 --poolOptions.threads.maxThreads=1 --poolOptions.threads.minThreads=1 --no-file-parallelism
