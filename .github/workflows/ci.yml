name: CI

on:
  workflow_dispatch:
  # push:
  #   branches: [master]
  # pull_request:
  #   branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Release beta-before-production rule
        run: tests/scripts/release-beta-rule.test.sh

      - name: Schema drift check
        run: npm run schema:check --workspace @abuddy/sdk

      - name: Build default-setup dev entry (for the SDK bridge drift check)
        run: node packages/default-setup/dev-build.mjs

      - name: Unit tests (api)
        run: npm test --workspace @app/api -- --reporter=verbose
        env:
          REQUIRE_DEV_ENTRY: '1'

      - name: Unit tests (default-setup)
        run: npm test --workspace @app/default-setup -- --reporter=verbose

      - name: Unit tests (sdk)
        run: npm test --workspace @abuddy/sdk -- --reporter=verbose

      - name: Unit tests (host)
        run: npm test --workspace @abuddy/host -- --reporter=verbose

      - name: API reports
        run: npm run api:check --workspace @abuddy/sdk --workspace @abuddy/ui

      - name: Build publishable packages
        run: npm run packages:build

      # publint and arethetypeswrong on every packed package (@abuddy/cli ships no types, so attw skips it)
      - name: Validate packed packages
        run: npm run packages:check

      - name: Unit tests (cli)
        run: npm test --workspace @abuddy/cli -- --reporter=verbose

      - name: Unit tests (renderer)
        run: npm run test:unit --workspace @app/renderer -- --run

  # Builds tests/fixtures/external-pack with the abuddy CLI and runs its Playwright
  # suite from the pack dir against the built app — the third-party pack path.
  external-pack-e2e:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci

      - name: Build app
        run: npm run build

      - name: External pack E2E
        run: npm run test:external-pack

      # Outside-author end state: packed @abuddy/* tarballs only, in a temp dir outside the repo
      - name: Packaged pack authoring E2E
        run: npm run test:packaged-authoring

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: external-pack-e2e
          path: |
            tests/fixtures/external-pack/tests/results/
            tests/fixtures/external-pack/tests/screenshots/
