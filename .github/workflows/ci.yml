name: CI

# The push and pull_request triggers are commented out ON PURPOSE. This is not broken, stale, or an
# oversight, and it does not need reporting as one.
#
# This is a single-contributor repo, and the full chain is already run locally before a merge — the root
# CLAUDE.md makes that a rule ("anything, before you ask for a merge | the full chain, once"). The jobs below
# run that same chain, so until someone else is committing, enabling them spends runner time to re-derive an
# answer that is already known.
#
# If you are an agent reading this: leave it disabled, do not open a PR to enable it, and do not cite CI as a
# gate that is failing or missing — there are no runs because there are no triggers. Say that and move on.
#
# Turn it on when the repo has other contributors. Uncomment both triggers; the jobs below are current and
# ready to run as they are. Until then it can still be run by hand from the Actions tab (workflow_dispatch).
#
# **What enabling it settles about the timeout ladder.** A runner here is the smaller machine `TIMEOUT_MS`
# (scripts/lib/step-timeouts.ts) is sized for, and each rung declares how much its kind of work stretches on
# one — two of the three borrowing a figure measured for the third. The jobs below reach two of the three
# rungs, and between them that is both borrowed rows: `quick` through `npm run typecheck`'s legs, and
# `scenario` through `external-pack-e2e`'s two steps, which `scripts/bounded.ts` bounds at that class. What
# they do not reach is `suite` — the pool deadlines come from `npm run chain`, which nothing here runs, and
# `npm test --workspace <each>` bypasses the pool runner. `suite` is also the one rung whose factor was
# measured, so nothing is waiting on it.

on:
  workflow_dispatch:
  # push:
  #   branches: [master]
  # pull_request:
  #   branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci

      # Includes check:specifiers (relative imports name .ts sources in sdk, host and ui)
      - name: Typecheck
        run: npm run typecheck

      - name: Release beta-before-production rule
        run: tests/scripts/release-beta-rule.test.sh

      - name: Schema drift check
        run: npm run schema:check --workspace @apack/sdk

      # Compiled content, snapshot, build/ (content compilers, content runtime) and the backend runtime: read by the
      # content parity, dependent-pack, SDK bridge drift and content runtime tests
      - name: Build default-setup pack artifacts
        working-directory: packages/default-setup
        run: npx apack build

      # The facade types dependents compile against match the reviewed report. It bundles the facade itself
      # rather than reading what the build above wrote, so the order here is convenience and not a dependency
      - name: Facade types report (default-setup)
        run: npm run facade:check --workspace @app/default-setup

      - name: Unit tests (api)
        run: npm test --workspace @app/api -- --reporter=verbose

      - name: Unit tests (default-setup)
        run: npm test --workspace @app/default-setup -- --reporter=verbose

      - name: Unit tests (sdk)
        run: npm test --workspace @apack/sdk -- --reporter=verbose
        env:
          REQUIRE_CONTENT_RUNTIME: '1'

      - name: Unit tests (ears)
        run: npm test --workspace @apack/ears -- --reporter=verbose

      - name: Unit tests (host)
        run: npm test --workspace @apack/host -- --reporter=verbose
        env:
          REQUIRE_RUNTIME_ENTRY: '1'

      # The typecheck step already built these through typecheck:pack; this confirms they are current
      - name: Build publishable packages
        run: npm run packages:ensure

      # After the build: a package's reports read its dependencies' published declarations
      - name: API reports
        run: npm run api:check --workspace @apack/ears --workspace @apack/sdk --workspace @apack/ui

      # publint and arethetypeswrong on every packed package (@apack/cli ships no types, so attw skips it)
      - name: Validate packed packages
        run: npm run packages:check

      - name: Publish dry run
        run: npm run packages:publish -- --dry-run

      - name: Unit tests (cli)
        run: npm test --workspace @apack/cli -- --reporter=verbose

      - name: Integration tests (cli)
        run: npm run test:integration --workspace @apack/cli -- --reporter=verbose

      - name: Unit tests (repo checks)
        run: npm test --workspace @app/repo-checks -- --reporter=verbose

      - name: Integration tests (repo checks)
        run: npm run test:integration --workspace @app/repo-checks -- --reporter=verbose

      - name: Unit tests (renderer)
        run: npm run test:unit --workspace @app/renderer -- --run

  # Builds tests/packs/external-pack with the apack CLI and runs its Playwright
  # suite from the pack dir against the built app — the third-party pack path.
  external-pack-e2e:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci

      - name: Build app
        run: npm run build

      - name: External pack E2E
        run: npm run test:external-pack

      # Outside-author end state: packed @apack/* tarballs only, in a temp dir outside the repo
      - name: Packaged pack authoring E2E
        run: npm run test:packaged-authoring

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: external-pack-e2e
          path: |
            tests/packs/external-pack/tests/results/
            tests/packs/external-pack/tests/screenshots/
